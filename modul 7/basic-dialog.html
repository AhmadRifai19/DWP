<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Basic Dialog jQuery UI</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f4f8; }
        .wrap { text-align: center; }
        h1 { color: #2563eb; margin-bottom: 20px; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="wrap">
        <h1>Basic Dialog - jQuery UI</h1>
        <button id="bukaDiaolog">Buka Dialog</button>
    </div>

    <div id="dialog" title="Informasi">
        <p>Ini adalah contoh <strong>Basic Dialog</strong> menggunakan jQuery UI.</p>
        <p>Dialog ini bisa ditutup dengan tombol OK atau tanda ✕.</p>
    </div>

    <script>
        $("#dialog").dialog({
            autoOpen: false,
            modal: true,
            buttons: {
                "OK": function() {
                    $(this).dialog("close");
                }
            }
        });

        $("#bukaDiaolog").click(function() {
            $("#dialog").dialog("open");
        });
    </script>

</body>
</html>
