<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jam Digital</title>
</head>
<body style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f4f8;">
    <div class="clock-box" style="text-align: center; background: white; padding: 40px 60px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <h1 style="color: #333; margin-bottom: 20px;">Jam Digital</h1>
        <div id="waktu" style="font-size: 3rem; font-weight: bold; color: #2563eb; letter-spacing: 2px; "></div>
        <div id="tanggal" style="font-size: 1.2rem; color: #555; margin-top: 10px;"></div>
    </div>

    <script>
        function tampilkanWaktu() {
            var sekarang = new Date();

            var jam    = String(sekarang.getHours()).padStart(2, '0');
            var menit  = String(sekarang.getMinutes()).padStart(2, '0');
            var detik  = String(sekarang.getSeconds()).padStart(2, '0');

            var hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            var bulan = ['Januari','Februari','Maret','April','Mei','Juni',
                         'Juli','Agustus','September','Oktober','November','Desember'];

            var namaHari  = hari[sekarang.getDay()];
            var tgl       = sekarang.getDate();
            var namaBulan = bulan[sekarang.getMonth()];
            var tahun     = sekarang.getFullYear();

            document.getElementById('waktu').innerHTML  = jam + ':' + menit + ':' + detik;
            document.getElementById('tanggal').innerHTML = namaHari + ', ' + tgl + ' ' + namaBulan + ' ' + tahun;
        }

        tampilkanWaktu();
        setInterval(tampilkanWaktu, 1000);
    </script>
</body>
</html>
