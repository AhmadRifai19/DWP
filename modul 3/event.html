<!DOCTYPE html>
<html lang="en">
<head>
  <title>Halaman Beranda</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="John Doe"><meta name="nim" content="12345"></head>
  <style>
    * {
        box-sizing: border-box;
        }
        body {
        font-family: Arial, Helvetica, sans-serif;
        }
        header {
        background-color: #666;
        padding: 30px;
        text-align: center;
        font-size: 35px;
        color: white;
        }
        section {
        display: flex;
        }
        nav {
        display: flex;
        width: 30%;
        background: #ccc;
        padding: 20px;
        justify-content: center;
        }
        nav ul {
        list-style-type: none;
        padding: 0;
        display: inline;
        justify-content: center;
        align-items: center;
        width: 60%;
        }
        article {
        padding: 20px;
        width: 70%;
        background-color: #f1f1f1;
        }
        footer {
        background-color: #777;
        padding: 10px;
        text-align: center;
        color: white;
        }
         nav ul li{
            background: #fef9f9;
            border: 1px solid black;
            border-radius: 15px;
            width: 100%;
            height: 40px;
            display:flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        nav ul li:hover {
            background-color: #555;
            color: white;
        }

        nav ul li:hover a {
            color: white;
        }

        nav ul li.active:hover {
            background-color: #555;
            color: white;
        }

        nav ul li.active:hover a {
            color: white;
        }

        nav ul li a{
            text-decoration: none;
            color: black;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            height: 100%;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center
        }

        nav ul li.active {
            background-color: cadetblue;
        }

        nav ul li.active a {
            color: white;
        }
        img {
          width: 280px;
          height: 400px;
        }
        @media (max-width: 600px) {
        nav, article {
            width: 100%;
            height: auto;
        }
        }
  </style>
<body>
  <header>
    <h2>Judul Website</h2>
  </header>

  <section>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gambar.html">Gambar</a></li>
            <li class="active"><a href="event.html">Event</a></li>
            <li><a href="audio.html">Audio</a></li>
            <li><a href="video.html">Video</a></li>
            <li><a href="svg.html">SVG</a></li>
            <li><a href="canvas.html">Canvas</a></li>
            <li><a href="pendaftaran.html">Pendaftaran</a></li>
        </ul>
    </nav>

    <article>
      <h1>Gambar</h1>
      <img onmousemove="bigImg(this)" onmouseout="normalImg(this)" src="gambar/Asta.jpg" alt="asta">
      <img onmousemove="bigImg(this)" onmouseout="normalImg(this)" src="gambar/Yami.jpg" alt="Yami">
      <img onmousemove="bigImg(this)" onmouseout="normalImg(this)" src="gambar/Noelle.jpg" alt="Noelle">
      <img onclick="alert('Anda Sudah melakukan klik pada gambar Nacht.');" src="gambar/Nacht.jpg" alt="Nacht">
      <img onwheel="zoomImage(event, this)" src="gambar/Nero.jpg" alt="Nero">
      <img ondblclick="alert('Anda sudah melakukan double click pada gambar Mereleona.');"src="gambar/Mereleona.jpg" alt="Mereleona">
    </article>
  </section>

  <footer>
    <p>&copy; 2026 - Praktikum HTML5 | Ahmad Rifai</p>
  </footer>

  <script>
    function bigImg(x) {
      x.style.height = "600px";
      x.style.width = "320px";
    }

    function normalImg(x) {
      x.style.height = "400px";
      x.style.width = "280px";
    }

    let currentScale = 1.0;

  function zoomImage(event, x) {

    event.preventDefault();

    if (event.deltaY < 0) {
      currentScale += 0.1;
    } else {
      currentScale -= 0.1;
    }

    if (currentScale < 0.5) currentScale = 0.5;
    if (currentScale > 3.0) currentScale = 3.0;

    x.style.transform = "scale(" + currentScale + ")";

    }
  </script>
</body>
</html>
