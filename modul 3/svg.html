  <style>
    * {
        box-sizing: border-box;
        }
        body {
        font-family: Arial, Helvetica, sans-serif;
        }
        header {
        background-color: #666;
        padding: 30px;
        text-align: center;
        font-size: 35px;
        color: white;
        }
        section {
        display: flex;
        }
        nav {
        display: flex;
        width: 30%;
        background: #ccc;
        padding: 20px;
        justify-content: center;
        }
        nav ul {
        list-style-type: none;
        padding: 0;
        display: inline;
        justify-content: center;
        align-items: center;
        width: 60%;
        }
        article {
        padding: 20px;
        width: 70%;
        background-color: #f1f1f1;
        }
        footer {
        background-color: #777;
        padding: 10px;
        text-align: center;
        color: white;
        }
        nav ul li{
            background: #fef9f9;
            border: 1px solid black;
            border-radius: 15px;
            width: 100%;
            height: 40px;
            display:flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        nav ul li:hover {
            background-color: #555;
            color: white;
        }

        nav ul li:hover a {
            color: white;
        }

        nav ul li.active:hover {
            background-color: #555;
            color: white;
        }

        nav ul li.active:hover a {
            color: white;
        }

        nav ul li a{
            text-decoration: none;
            color: black;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            height: 100%;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center
        }

        nav ul li.active {
            background-color: cadetblue;
        }

        nav ul li.active a {
            color: white;
        }
        @media (max-width: 600px) {
        nav, article {
            width: 100%;
            height: auto;
        }
        }
  </style>
</head>
