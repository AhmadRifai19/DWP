        <article>
            <h1>Form Penjadwalan Pertemuan</h1>

            <form action="#" method="POST">
    
                <fieldset>
                <legend>Informasi Pribadi</legend>
                
                <br>

                <label for="nama">Nama: </label>
                <input type="text" id="nama" name="nama"><br><br>

                <label for="telepon">No. Telepon: </label>
                <input type="tel" id="telepon" name="telepon"><br><br>

                <label for="email">Alamat Email: </label>
                <input type="email" id="email" name="email"><br><br>

                <label for="tgl_lahir">Tanggal Lahir: </label>
                <input type="date" id="tgl_lahir" name="tgl_lahir" min="1987-01-01" max="1993-01-01" required><br><br>
                </fieldset>

                <fieldset>
                <legend>Permintaan Pertemuan</legend>
                
                <br>

                <label for="tujuan">Tujuan Pertemuan: </label>
                <input type="text" id="tujuan" name="tujuan"><br><br>

                <label for="kepentingan">Tingkat Kepentingan (0-10): </label>
                <input type="range" id="kepentingan" name="kepentingan" min="1" max="10"><br><br>

                <label for="tgl_pertemuan">Tanggal Kunjungan: </label>
                <input type="date" id="tgl_pertemuan" name="tgl_pertemuan"><br><br>

                <label for="waktu">Waktu (17.00 - 21.00): </label>
                <input type="time" id="waktu" name="waktu"><br><br>
                </fieldset>

                <br>

                <button type="submit">Submit</button>

            </form>

        </article>
