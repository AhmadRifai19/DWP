<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./../input.css">
    <link href="./../output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-red-50 flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-10">
        <div class="flex flex-col items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800 font-roboto">Selamat Datang</h1>
        </div>

        <form action="#" method="post" class="flex flex-col gap-5">
            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                    Email
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="contoh@email.com"
                    required
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 outline-none focus:border-[rgb(86,135,219)] focus:ring-2 focus:ring-[rgb(86,135,219)]/30 transition-all placeholder-gray-400">
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="password" class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 outline-none focus:border-[rgb(86,135,219)] focus:ring-2 focus:ring-[rgb(86,135,219)]/30 transition-all placeholder-gray-400">
            </div>

            <div class="flex justify-between items-center text-sm">
                <label class="flex items-center gap-2 text-gray-500 cursor-pointer select-none">
                    <input type="checkbox" name="remember" class="accent-[rgb(86,135,219)] w-4 h-4">
                    Ingat saya
                </label>
                <a href="#" class="text-[rgb(86,135,219)] hover:underline">Lupa password?</a>
            </div>

            <button
                type="submit"
                class="w-full py-3 rounded-xl bg-[rgb(86,135,219)] text-white font-bold text-base hover:bg-[rgb(70,115,200)] active:scale-95 transition-all cursor-pointer shadow-md">
                Masuk
            </button>

        </form>

        <div class="flex items-center gap-3 my-6">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-xs text-gray-400">atau</span>
            <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <p class="text-center text-sm text-gray-500">
            Belum punya akun?
            <a href="Register.html" class="text-[rgb(86,135,219)] font-semibold hover:underline">Daftar sekarang</a>
        </p>
    </div>
</body>
</html>
