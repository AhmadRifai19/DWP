<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="./../output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-red-50 flex items-center justify-center py-10">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-10">
        <div class="flex flex-col items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800 font-roboto">Hubungi Kami</h1>
        </div>

        <div class="flex flex-col gap-8">
            <div class="grid grid-cols-3 gap-4 text-center">

                <div class="flex flex-col items-center gap-2 p-4 bg-red-50 rounded-xl">
                    <div class="w-10 h-10 rounded-full bg-[rgb(86,135,219)] flex items-center justify-center">
                        <img src="../assets/gambar/icon-phone.svg" width="18" height="18" alt="Telepon">
                    </div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Telepon</p>
                    <p class="text-sm text-gray-700 font-semibold">+62 812 3456 7890</p>
                </div>

                <div class="flex flex-col items-center gap-2 p-4 bg-red-50 rounded-xl">
                    <div class="w-10 h-10 rounded-full bg-[rgb(86,135,219)] flex items-center justify-center">
                        <img src="../assets/gambar/icon-email.svg" width="18" height="18" alt="Email">
                    </div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Email</p>
                    <p class="text-sm text-gray-700 font-semibold">abcd@fghij.com</p>
                </div>

                <div class="flex flex-col items-center gap-2 p-4 bg-red-50 rounded-xl">
                    <div class="w-10 h-10 rounded-full bg-[rgb(86,135,219)] flex items-center justify-center">
                        <img src="../assets/gambar/icon-location.svg" width="18" height="18" alt="Lokasi">
                    </div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Alamat</p>
                    <p class="text-sm text-gray-700 font-semibold">Jl. Raya apel, buah</p>
                </div>
            </div>

            <div class="h-px bg-gray-200"></div>
            <form action="#" method="post" class="flex flex-col gap-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label for="nama" class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                            Nama
                        </label>
                        <input
                            type="text"
                            id="nama"
                            name="nama"
                            placeholder="Nama Anda"
                            required
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 outline-none focus:border-[rgb(86,135,219)] focus:ring-2 focus:ring-[rgb(86,135,219)]/30 transition-all placeholder-gray-400">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="email" class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                            Email
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="contoh@email.com"
                            required
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 outline-none focus:border-[rgb(86,135,219)] focus:ring-2 focus:ring-[rgb(86,135,219)]/30 transition-all placeholder-gray-400">
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="subjek" class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                        Subjek
                    </label>
                    <input
                        type="text"
                        id="subjek"
                        name="subjek"
                        placeholder="Topik pesan Anda"
                        required
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 outline-none focus:border-[rgb(86,135,219)] focus:ring-2 focus:ring-[rgb(86,135,219)]/30 transition-all placeholder-gray-400">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="pesan" class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                        Pesan
                    </label>
                    <textarea
                        id="pesan"
                        name="pesan"
                        rows="5"
                        placeholder="Tulis pesan Anda di sini..."
                        required
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 outline-none focus:border-[rgb(86,135,219)] focus:ring-2 focus:ring-[rgb(86,135,219)]/30 transition-all placeholder-gray-400 resize-none"></textarea>
                </div>

                <button
                    type="submit"
                    class="w-full py-3 rounded-xl bg-[rgb(86,135,219)] text-white font-bold text-base hover:bg-[rgb(70,115,200)] active:scale-95 transition-all cursor-pointer shadow-md">
                    Kirim Pesan
                </button>
            </form>
        </div>
    </div>

</body>
</html>
