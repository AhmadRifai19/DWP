<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>

    <style>
        .container {
            display: grid;
            background-color: hsl(207, 90%, 54%);
            padding: 10px;
            grid-template-columns: auto auto auto auto;
        }

        div > div {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            font-size: 30px;
            border: 5px solid hsl(207, 90%, 54%);
            text-align: center;
        }

        .header {
            grid-column-start: 1;
            grid-column-end: 5;
        }

        .menu {
            grid-row: 2 / 4;
        }

        .main {
            grid-column-start: 2;
            grid-column-end: 4;
        }

        .right {
            grid-column-start: 4;
            grid-column-end: 5;
        }

        .footer {
            grid-column-start: 2;
            grid-column-end: 5;
        }

    </style>

</head>
<body>
    <h1>Belajar Layout</h1>

    <div class="container">
        <div class="header">Header</div>
        <div class="menu">Menu</div>
        <div class="main">Main</div>
        <div class="right">Right</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
